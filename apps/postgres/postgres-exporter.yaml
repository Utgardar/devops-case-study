---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-exporter
  namespace: postgres
spec:
  releaseName: postgres-exporter
  interval: 10m
  timeout: 5m
  dependsOn:
    - name: prometheus-stack
      namespace: monitoring
  chart:
    spec:
      chart: prometheus-postgres-exporter
      version: "8.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    fullnameOverride: postgres-exporter
    replicaCount: 1
    service:
      type: ClusterIP
      port: 9187
      targetPort: 9187
    config:
      datasource:
        host: postgres.postgres.svc.cluster.local
        port: "5432"
        database: voize
        sslmode: disable
        userFile: /etc/postgres-credentials/username
        passwordFile: /etc/postgres-credentials/password
    extraVolumes:
      - name: postgres-credentials
        configMap:
          name: postgres-config
          items:
            - key: POSTGRES_USER
              path: username
            - key: POSTGRES_PASSWORD
              path: password
    extraVolumeMounts:
      - name: postgres-credentials
        mountPath: /etc/postgres-credentials
        readOnly: true
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 200m, memory: 128Mi}
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 15s
      timeout: 5s
      telemetryPath: /metrics
      labels:
        release: prometheus-stack
        collector: prometheus
